<line x1="672" y1="321" x2="720" y2="321" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="812" y1="321" x2="850" y2="321" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="676" y="314" font-size="11" text-anchor="start" font-weight="normal">r1</text>
<text x="816" y="314" font-size="11" text-anchor="start" font-weight="normal">r2</text>
<rect x="230" y="440" width="320" height="50" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="390.0" y="469.6" font-size="13" text-anchor="middle" font-weight="bold">국소 산-염기 평형 → pH</text>
