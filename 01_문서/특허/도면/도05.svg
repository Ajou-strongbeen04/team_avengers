<text x="390.0" y="569.5" font-size="13" text-anchor="middle" font-weight="normal">비이온 암모니아 분율 f(pH, T) × TAN</text>
<line x1="390" y1="490" x2="390" y2="540" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="620" y="540" width="300" height="50" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="770.0" y="568.9" font-size="11" text-anchor="middle" font-weight="bold">위험 판정 : 항목별 위험구역의 합집합</text>
<text x="626" y="534" font-size="12" text-anchor="start" font-weight="bold">50</text>
<line x1="550" y1="565" x2="620" y2="565" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="136,342 136,565 230,565" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="626" font-size="11" text-anchor="start" font-weight="normal">요지 : 수온이 모든 계수를 닫고, 유동장 하나가 모든 항목을 나른다. pH 는 이송하지 않고 보존량 두 개(DIC, Alk)로부터 산출한다.</text>
</svg>
