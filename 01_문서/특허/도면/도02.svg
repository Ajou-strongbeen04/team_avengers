<line x1="680" y1="483" x2="700" y2="405" stroke="#000" stroke-width="0.9" marker-end="url(#a)"/>
<text x="60" y="560" font-size="13" text-anchor="start" font-weight="normal">요지 : 관측은 3종으로 고정되고, 항목을 늘려도 센서가 늘지 않는다.</text>
<text x="60" y="586" font-size="11" text-anchor="start" font-weight="normal">난류확산 계수가 항목에 무관하므로 하나의 유동장이 모든 항목의 공간 골격을 결정한다.</text>
<text x="60" y="610" font-size="11" text-anchor="start" font-weight="normal">항목을 가르는 것은 표면 경계조건의 종류와 소스항뿐이다.</text>
