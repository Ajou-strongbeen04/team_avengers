<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="#000" stroke-width="1.4"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.7"/></pattern>
  <pattern id="hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#000" stroke-width="0.7"/></pattern>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000"/></pattern>
</defs>
<rect width="900" height="880" fill="#fff"/>
<text x="18" y="30" font-size="17" font-weight="bold">【도 9】</text>
<rect x="150" y="80" width="560" height="74" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="430.0" y="113.8" font-size="11" text-anchor="middle" font-weight="normal">S1. 기준 수조에 탈산소 시약 투입 → 벌크 DO ≈ 0</text>
<text x="430.0" y="127.8" font-size="11" text-anchor="middle" font-weight="normal">(CO2 항목은 CO2 주입으로 과포화 : 거울상 시험)</text>
<line x1="430" y1="154" x2="430" y2="180" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="180" width="560" height="46" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="430.0" y="206.8" font-size="11" text-anchor="middle" font-weight="normal">S2. 폭기 개시, 벌크 농도 시간이력 기록</text>
<line x1="430" y1="226" x2="430" y2="252" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="252" width="560" height="74" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="430.0" y="285.9" font-size="11" text-anchor="middle" font-weight="normal">S3. 지수 회귀 C_b(t) = C* − (C* − C_b0) exp(−K_L a_eff · t)</text>
<text x="430.0" y="299.9" font-size="11" text-anchor="middle" font-weight="normal">→ K_L a_eff, meas 및 C*_meas 추정</text>
<line x1="430" y1="326" x2="430" y2="352" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="352" width="560" height="74" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="430.0" y="385.9" font-size="11" text-anchor="middle" font-weight="normal">S4. 동일 초기조건으로 물리모델 가상 시험 수행</text>
<text x="430.0" y="399.9" font-size="11" text-anchor="middle" font-weight="normal">→ K_L a_eff, CFD</text>
<line x1="430" y1="426" x2="430" y2="452" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="452" width="560" height="46" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="430.0" y="478.9" font-size="11" text-anchor="middle" font-weight="normal">S5. κ = K_L a_eff,meas / K_L a_eff,CFD ,  ΔC* = C*_meas − C*_CFD</text>
<line x1="430" y1="498" x2="430" y2="524" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="524" width="560" height="46" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="430.0" y="550.9" font-size="11" text-anchor="middle" font-weight="normal">S6. 회귀 잔차를 모델 불확실도로 정량화</text>
<line x1="430" y1="570" x2="430" y2="596" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="596" width="560" height="74" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="430.0" y="629.9" font-size="11" text-anchor="middle" font-weight="normal">S7. 캘리브레이션에 쓰지 않은 조건에 재피팅 없이 적용</text>
<text x="430.0" y="643.9" font-size="11" text-anchor="middle" font-weight="normal">→ 전이 잔차 확인 (순환논리 차단)</text>
<line x1="430" y1="670" x2="430" y2="696" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="696" width="560" height="74" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="430.0" y="729.9" font-size="11" text-anchor="middle" font-weight="normal">S8. κ 와 잔차를 제2계층(42)의 불확실성 채널로 전파</text>
<text x="430.0" y="743.9" font-size="11" text-anchor="middle" font-weight="normal">→ 출력을 셀별 위험 확률로 제공</text>
<text x="724" y="128" font-size="11" text-anchor="start" font-weight="normal">0차원 축약 :</text>
<text x="724" y="148" font-size="11" text-anchor="start" font-weight="normal">dC_b/dt = K_L a_eff (C* − C_b)</text>
<text x="724" y="300" font-size="11" text-anchor="start" font-weight="normal">κ 는 집약 계수이므로</text>
<text x="724" y="320" font-size="11" text-anchor="start" font-weight="normal">개별 오차원(난류 폐쇄,</text>
<text x="724" y="340" font-size="11" text-anchor="start" font-weight="normal">계면전달, 난류확산,</text>
<text x="724" y="360" font-size="11" text-anchor="start" font-weight="normal">기포 플룸 근사)을</text>
<text x="724" y="380" font-size="11" text-anchor="start" font-weight="normal">분리하지 못한다.</text>
<text x="724" y="412" font-size="11" text-anchor="start" font-weight="normal">조건의존적 유효</text>
<text x="724" y="432" font-size="11" text-anchor="start" font-weight="normal">보정계수로 취급한다.</text>
<text x="120" y="108" font-size="12" text-anchor="start" font-weight="bold">81</text>
<text x="120" y="706" font-size="12" text-anchor="start" font-weight="bold">82</text>
<text x="40" y="846" font-size="11" text-anchor="start" font-weight="normal">* CO2 탈기 시험으로 k_L,i = k_L,O2 (D_mol,i / D_mol,O2)^n 의 지수 n 을 실측 결정한다. 이 한 번의 시험으로 휘발성 기체 항목군 전체가 닫힌다.</text>
</svg>
