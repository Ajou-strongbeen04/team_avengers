<line x1="661.0" y1="304" x2="661.0" y2="322" stroke="#000" stroke-width="0.9"/>
<rect x="685" y="322" width="42" height="40" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="706.0" y="345.9" font-size="11" text-anchor="middle" font-weight="normal">NO3-</text>
<line x1="706.0" y1="304" x2="706.0" y2="322" stroke="#000" stroke-width="0.9"/>
<rect x="730" y="322" width="42" height="40" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="751.0" y="345.9" font-size="11" text-anchor="middle" font-weight="normal">DIC</text>
<line x1="751.0" y1="304" x2="751.0" y2="322" stroke="#000" stroke-width="0.9"/>
<rect x="775" y="322" width="42" height="40" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="796.0" y="345.9" font-size="11" text-anchor="middle" font-weight="normal">Alk</text>
<line x1="796.0" y1="304" x2="796.0" y2="322" stroke="#000" stroke-width="0.9"/>
<rect x="820" y="322" width="42" height="40" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="841.0" y="345.9" font-size="11" text-anchor="middle" font-weight="normal">C_p</text>
<line x1="841.0" y1="304" x2="841.0" y2="322" stroke="#000" stroke-width="0.9"/>
<text x="685" y="382" font-size="11" text-anchor="middle" font-weight="normal">동일 유동장 · 동일 난류확산 계수 → 항목 추가 비용 = 선형 풀이 1회</text>
<rect x="500" y="400" width="370" height="46" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="685.0" y="426.9" font-size="11" text-anchor="middle" font-weight="normal">국소 산-염기 평형 풀이 → pH, f(NH3)</text>
<text x="506" y="394" font-size="12" text-anchor="start" font-weight="bold">43</text>
<line x1="685" y1="362" x2="685" y2="400" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="500" y="474" width="370" height="46" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="685.0" y="500.9" font-size="11" text-anchor="middle" font-weight="normal">보정계수 κ · 잔차 전파 (불확실성 채널)</text>
<text x="506" y="468" font-size="12" text-anchor="start" font-weight="bold">80</text>
<line x1="685" y1="446" x2="685" y2="474" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="500" y="548" width="370" height="46" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="685.0" y="574.9" font-size="11" text-anchor="middle" font-weight="normal">항목별 셀 위험 확률 P_risk,i(x)</text>
<line x1="685" y1="520" x2="685" y2="548" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="500" y="604" width="370" height="34" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="685.0" y="624.9" font-size="11" text-anchor="middle" font-weight="normal">구역 단위 조대화 → 융합 판정부(50)</text>
<line x1="685" y1="594" x2="685" y2="604" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="430" font-size="11" text-anchor="start" font-weight="normal">비싼 층만 오프라인으로 동결하므로</text>
<text x="40" y="452" font-size="11" text-anchor="start" font-weight="normal">온라인 비용은 선형 스칼라층에 갇힌다.</text>
<text x="40" y="486" font-size="11" text-anchor="start" font-weight="normal">제1계층은 어종 임계·생물 소스와</text>
<text x="40" y="508" font-size="11" text-anchor="start" font-weight="normal">독립이므로, 사육조건이 바뀌어도</text>
<text x="40" y="530" font-size="11" text-anchor="start" font-weight="normal">재생성할 필요가 없다.</text>
