<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="#000" stroke-width="1.4"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="0.7"/></pattern>
  <pattern id="hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#000" stroke-width="0.7"/></pattern>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000"/></pattern>
</defs>
<rect width="940" height="700" fill="#fff"/>
<text x="18" y="30" font-size="17" font-weight="bold">【도 4】</text>
<rect x="40" y="60" width="380" height="330" rx="6" fill="none" stroke="#000" stroke-width="1.6" stroke-dasharray="8 4"/>
<text x="60" y="84" font-size="13" text-anchor="start" font-weight="bold">오프라인 (서버측) — 1회 수행</text>
<rect x="70" y="100" width="320" height="50" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="230.0" y="128.8" font-size="11" text-anchor="middle" font-weight="normal">기하 파라미터 공간 표집</text>
<text x="76" y="94" font-size="12" text-anchor="start" font-weight="bold">91</text>
<rect x="70" y="178" width="320" height="62" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="230.0" y="205.8" font-size="11" text-anchor="middle" font-weight="normal">과도 URANS 해석 (SST k–ω)</text>
<text x="230.0" y="219.8" font-size="11" text-anchor="middle" font-weight="normal">케이스마다 1회</text>
<text x="76" y="172" font-size="12" text-anchor="start" font-weight="bold">90</text>
<rect x="70" y="268" width="320" height="62" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="230.0" y="295.9" font-size="11" text-anchor="middle" font-weight="normal">시간평균 유동장 Ū 와 와점성 ν_t 저장</text>
<text x="230.0" y="309.9" font-size="11" text-anchor="middle" font-weight="normal">(ν_t 는 생값으로 저장)</text>
<text x="76" y="262" font-size="12" text-anchor="start" font-weight="bold">92</text>
<line x1="230" y1="150" x2="230" y2="178" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="230" y1="240" x2="230" y2="268" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="70" y="350" width="320" height="34" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
