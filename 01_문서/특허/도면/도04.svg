<text x="685.0" y="284.9" font-size="11" text-anchor="middle" font-weight="normal">제2계층 (B층) : 유동장 고정 → 선형 스칼라 수송</text>
<text x="506" y="252" font-size="12" text-anchor="start" font-weight="bold">42</text>
