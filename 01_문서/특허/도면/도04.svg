<line x1="230" y1="330" x2="230" y2="350" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="470" y="60" width="430" height="580" rx="6" fill="none" stroke="#000" stroke-width="1.6"/>
