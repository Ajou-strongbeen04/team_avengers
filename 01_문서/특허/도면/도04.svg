<rect x="500" y="174" width="370" height="56" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="685.0" y="198.8" font-size="11" text-anchor="middle" font-weight="normal">제1계층 (A층) : 기하 → 시간평균 유동장</text>
<text x="685.0" y="212.8" font-size="11" text-anchor="middle" font-weight="normal">조회가 아니라 예측(보간)</text>
<text x="506" y="168" font-size="12" text-anchor="start" font-weight="bold">41</text>
<line x1="685" y1="146" x2="685" y2="174" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="420" y1="367" x2="500" y2="202" stroke="#000" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#a)"/>
<text x="496" y="246" font-size="11" text-anchor="end" font-weight="normal">학습된 대리모델 이식</text>
