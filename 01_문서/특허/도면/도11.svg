<line x1="385" y1="298" x2="385" y2="326" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="326" width="470" height="42" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="385.0" y="350.9" font-size="11" text-anchor="middle" font-weight="normal">수온·탁도 계측 및 항목별 판정</text>
<text x="140" y="351.0" font-size="12" text-anchor="end" font-weight="bold">S40</text>
<line x1="385" y1="368" x2="385" y2="396" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="396" width="470" height="60" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
