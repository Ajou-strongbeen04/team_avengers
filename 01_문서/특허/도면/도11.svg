<line x1="385" y1="210" x2="385" y2="238" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="238" width="470" height="60" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="385.0" y="264.9" font-size="11" text-anchor="middle" font-weight="normal">물리모델 경계조건 데이터 생성</text>
<text x="385.0" y="278.9" font-size="11" text-anchor="middle" font-weight="normal">(정량 계수는 배제)</text>
