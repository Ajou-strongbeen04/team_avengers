<text x="385.0" y="176.8" font-size="11" text-anchor="middle" font-weight="normal">영상에서 기하·위상 인식</text>
<text x="385.0" y="190.8" font-size="11" text-anchor="middle" font-weight="normal">(해석좌표계 정규화 좌표)</text>
