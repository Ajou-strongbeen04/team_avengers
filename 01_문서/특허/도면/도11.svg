<line x1="385" y1="456" x2="385" y2="484" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="484" width="470" height="42" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="385.0" y="508.9" font-size="11" text-anchor="middle" font-weight="normal">제1계층 대리모델 → 시간평균 유동장 Ū, ν_t</text>
<text x="140" y="509.0" font-size="12" text-anchor="end" font-weight="bold">S60</text>
<line x1="385" y1="526" x2="385" y2="554" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="554" width="470" height="60" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="385.0" y="580.9" font-size="11" text-anchor="middle" font-weight="normal">제2계층 : DO·CO2·TAN·NO2-·NO3-·DIC·Alk·C_p</text>
<text x="385.0" y="594.9" font-size="11" text-anchor="middle" font-weight="normal">복수 스칼라 병렬 선형 풀이</text>
