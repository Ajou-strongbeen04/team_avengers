<text x="385.0" y="682.9" font-size="11" text-anchor="middle" font-weight="normal">pH·T → 비이온 암모니아 독성분율</text>
<text x="140" y="676.0" font-size="12" text-anchor="end" font-weight="bold">S80</text>
<line x1="385" y1="702" x2="385" y2="730" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="730" width="470" height="60" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="385.0" y="756.9" font-size="11" text-anchor="middle" font-weight="normal">보정계수 κ·잔차 적용·전파</text>
<text x="385.0" y="770.9" font-size="11" text-anchor="middle" font-weight="normal">→ 항목별 위험 확률맵</text>
<text x="140" y="764.0" font-size="12" text-anchor="end" font-weight="bold">S90</text>
<line x1="385" y1="790" x2="385" y2="818" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="150" y="818" width="470" height="60" rx="3" fill="none" stroke="#000" stroke-width="1.6"/>
<text x="385.0" y="844.9" font-size="11" text-anchor="middle" font-weight="normal">항목별 위험구역 결합·어긋남 표시</text>
<text x="385.0" y="858.9" font-size="11" text-anchor="middle" font-weight="normal">통합 위험 판정 및 배치 처방 출력</text>
<text x="140" y="852.0" font-size="12" text-anchor="end" font-weight="bold">S100</text>
<polyline points="620,848 700,848 700,505 620,505" fill="none" stroke="#000" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="706" y="565" font-size="11" text-anchor="start" font-weight="normal">처방 후보마다</text>
<text x="706" y="583" font-size="11" text-anchor="start" font-weight="normal">제1계층 재호출</text>
<text x="706" y="601" font-size="11" text-anchor="start" font-weight="normal">→ 예상 개선량</text>
<text x="706" y="619" font-size="11" text-anchor="start" font-weight="normal">비교 (S110)</text>
